name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: python -m pip install -r requirements.txt ruff

      - name: Release metadata
        run: python scripts/release_validate.py

      - name: Source structure
        run: python scripts/validate_source.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          QECTOR_SILENT: "1"

      - name: Lint
        run: ruff check .

      - name: Build release artifacts
        run: python scripts/build_release.py --all

      - name: Bundle validation
        run: python scripts/validate_plugin_bundle.py
